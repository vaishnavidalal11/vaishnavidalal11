<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="560" fill="#06070a"/>

  <!-- vertical animated line -->
  <line x1="120" y1="60" x2="120" y2="500" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="440" stroke-dashoffset="440">
    <animate attributeName="stroke-dashoffset" from="440" to="0" dur="2.5s" fill="freeze"/>
  </line>

  <g font-family="'Segoe UI',sans-serif">
    <!-- Node template -->
    <circle cx="120" cy="70" r="9" fill="#38bdf8" filter="url(#nodeGlow)"><animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/></circle>
    <text x="150" y="65" font-size="17" font-weight="700" fill="#e5e7eb">Computer Engineering</text>
    <text x="150" y="86" font-size="13" fill="#9ca3af">B.E. — CGPA 9.19</text>

    <circle cx="120" cy="150" r="9" fill="#5eb6f0" filter="url(#nodeGlow)"><animate attributeName="opacity" values="1;0.5;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <text x="150" y="145" font-size="17" font-weight="700" fill="#e5e7eb">Research</text>
    <text x="150" y="166" font-size="13" fill="#9ca3af">Research Intern — College of Military Engineering</text>

    <circle cx="120" cy="230" r="9" fill="#7ea9f5" filter="url(#nodeGlow)"><animate attributeName="opacity" values="1;0.5;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <text x="150" y="225" font-size="17" font-weight="700" fill="#e5e7eb">Backend Engineering</text>
    <text x="150" y="246" font-size="13" fill="#9ca3af">Engineering Intern — Qualys</text>

    <circle cx="120" cy="310" r="9" fill="#9d8cf0" filter="url(#nodeGlow)"><animate attributeName="opacity" values="1;0.5;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <text x="150" y="305" font-size="17" font-weight="700" fill="#e5e7eb">AI Engineering</text>
    <text x="150" y="326" font-size="13" fill="#9ca3af">LLMs · RAG · AI Agents · LangChain</text>

    <circle cx="120" cy="390" r="9" fill="#c084fc" filter="url(#nodeGlow)"><animate attributeName="opacity" values="1;0.5;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <text x="150" y="385" font-size="17" font-weight="700" fill="#e5e7eb">Production Systems</text>
    <text x="150" y="406" font-size="13" fill="#9ca3af">Scalable, cloud-native applications</text>

    <circle cx="120" cy="470" r="9" fill="#e0aaff" filter="url(#nodeGlow)"><animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/></circle>
    <text x="150" y="465" font-size="17" font-weight="700" fill="#e5e7eb">Open Source</text>
    <text x="150" y="486" font-size="13" fill="#9ca3af">Building in public, contributing forward</text>
  </g>
</svg>
