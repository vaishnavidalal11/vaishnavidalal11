<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="termStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="420" rx="16" fill="url(#termBg)" stroke="url(#termStroke)" stroke-width="1.2"/>

  <!-- title bar -->
  <rect x="0" y="0" width="900" height="38" rx="16" fill="#0f1420"/>
  <rect x="0" y="20" width="900" height="18" fill="#0f1420"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="19" r="6" fill="#27c93f"/>
  <text x="450" y="24" text-anchor="middle" font-family="'Cascadia Code','Fira Code',monospace" font-size="12" fill="#6b7280">vaishnavi@github: ~</text>

  <g font-family="'Cascadia Code','Fira Code',monospace" font-size="15" fill="#c9d1d9">
    <text x="24" y="70" fill="#67e8f9">$ ssh github.com/vaishnavidalal</text>

    <text x="24" y="98" fill="#6b7280" opacity="0">
      Connecting...
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.1;0.4;1" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="24" y="98" fill="#34d399" opacity="0">
      Connected.
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.1;0.15;0.2;0.5;1" dur="10s" repeatCount="indefinite"/>
    </text>

    <text x="24" y="136" fill="#c084fc" opacity="0">
      &gt; whoami
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.25;1" dur="10s" repeatCount="indefinite"/>
    </text>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.33;1" dur="10s" repeatCount="indefinite"/>
      <text x="24" y="164">Vaishnavi Dalal</text>
      <text x="24" y="190">Software Engineer</text>
      <text x="24" y="216">AI Developer</text>
      <text x="24" y="242">Problem Solver</text>
    </g>

    <text x="24" y="280" fill="#c084fc" opacity="0">
      &gt; current_focus
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.6;1" dur="10s" repeatCount="indefinite"/>
    </text>

    <g opacity="0" fill="#93c5fd">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.66;0.95;1" dur="10s" repeatCount="indefinite"/>
      <text x="24" y="308">Building AI-powered applications</text>
      <text x="24" y="330">LLMs · FastAPI · Next.js · Docker</text>
      <text x="24" y="352">Distributed Systems</text>
    </g>

    <rect x="24" y="365" width="10" height="18" fill="#67e8f9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
